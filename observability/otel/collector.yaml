apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata: {name: careflow, namespace: observability}
spec:
  mode: daemonset
  config:
    receivers: {otlp: {protocols: {grpc: {}, http: {}}}}
    processors: {memory_limiter: {check_interval: 1s, limit_mib: 400}, batch: {}}
    exporters: {debug: {verbosity: basic}}
    service: {pipelines: {traces: {receivers: [otlp], processors: [memory_limiter,batch], exporters: [debug]}, metrics: {receivers: [otlp], processors: [memory_limiter,batch], exporters: [debug]}}}
