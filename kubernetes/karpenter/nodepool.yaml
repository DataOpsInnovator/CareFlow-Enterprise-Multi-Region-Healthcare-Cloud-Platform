apiVersion: karpenter.sh/v1
kind: NodePool
metadata: {name: general}
spec:
  disruption: {consolidationPolicy: WhenEmptyOrUnderutilized, consolidateAfter: 5m}
  limits: {cpu: "500", memory: 1000Gi}
  template:
    metadata: {labels: {workload-tier: general}}
    spec:
      nodeClassRef: {group: eks.amazonaws.com, kind: NodeClass, name: general}
      requirements:
      - {key: kubernetes.io/arch, operator: In, values: [amd64, arm64]}
      - {key: karpenter.sh/capacity-type, operator: In, values: [on-demand, spot]}
      - {key: karpenter.k8s.aws/instance-category, operator: In, values: [m, c, r]}
      - {key: karpenter.k8s.aws/instance-generation, operator: Gt, values: [5]}
---
apiVersion: eks.amazonaws.com/v1
kind: NodeClass
metadata: {name: general}
spec:
  role: REPLACE_WITH_KARPENTER_NODE_ROLE
  subnetSelectorTerms: [{tags: {karpenter.sh/discovery: REPLACE_WITH_CLUSTER_NAME}}]
  securityGroupSelectorTerms: [{tags: {karpenter.sh/discovery: REPLACE_WITH_CLUSTER_NAME}}]
  ephemeralStorage: {size: 80Gi, iops: 3000, throughput: 125}
