name: terraform-plan

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Validate ${{ matrix.stack }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stack: [primary, secondary]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: github-terraform-plan

      - name: Terraform init without backend
        run: terraform -chdir=terraform/live/${{ matrix.stack }} init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform/live/${{ matrix.stack }} validate
