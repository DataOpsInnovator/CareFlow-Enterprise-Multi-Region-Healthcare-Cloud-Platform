name: Bug report
description: Report a reproducible defect in the repository
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include credentials, PHI, tokens, private keys, or other sensitive information.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
  - type: input
    id: version
    attributes:
      label: Commit or version
